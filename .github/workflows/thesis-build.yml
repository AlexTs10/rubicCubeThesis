name: thesis-build

on:
  workflow_dispatch:
    inputs:
      run-expanded-validation:
        description: "Run opt-in slow/external/cache-building validation profile"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "data/**"
      - "docs/**"
      - "results/**"
      - "src/**"
      - "tests/**"
      - "thesis/**"
      - "webapp/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements.lock"
      - "verify_setup.py"
      - "scripts/**"
      - "scripts/thesis_workflow.py"
      - "docker/thesis.Dockerfile"
      - ".github/workflows/thesis-build.yml"

jobs:
  python-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run fast Python tests
        run: python -m pytest tests -q

      - name: Run coverage gate
        run: python -m pytest tests -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=49

      - name: Run source-ZIP native exact smoke validation
        run: python scripts/verification/native_exact_validation.py --preset source-zip --output-dir /tmp/native_exact_source_zip

  expanded-python-validation:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run-expanded-validation == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Collect expanded validation tests
        run: python -m pytest tests --collect-only -q -o addopts='' -m "slow or external or cache_building" | tee expanded-validation-collect.log

      - name: Run expanded validation tests
        env:
          RUN_NATIVE_ORACLE_TESTS: "1"
        run: python -m pytest tests -q -o addopts='' -m "slow or external or cache_building" | tee expanded-validation.log

      - name: Run canonical native exact validation when companion artifacts are present
        env:
          RUN_NATIVE_ORACLE_TESTS: "1"
        run: |
          if [ -f data/pattern_databases/corner_db.pkl ]; then
            python scripts/verification/native_exact_validation.py --preset canonical --output-dir /tmp/native_exact_canonical | tee canonical-native-exact.log
          else
            echo "Skipping canonical native exact validation: data/pattern_databases/corner_db.pkl companion cache is absent." | tee canonical-native-exact.log
          fi

      - name: Upload expanded validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-python-validation-logs
          path: |
            expanded-validation-collect.log
            expanded-validation.log
            canonical-native-exact.log

  webapp-validation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Enable pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.6.0 --activate

      - name: Install webapp dependencies
        run: npm ci

      - name: Run webapp tests
        run: npm test

      - name: Build webapp
        run: npm run build

  build-thesis:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python thesis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate thesis sources
        run: python scripts/thesis_workflow.py validate

      - name: Build thesis PDF with source-defined Docker image
        run: python scripts/thesis_workflow.py build --mode docker

      - name: Record PDF hash
        run: shasum -a 256 thesis/main.pdf | tee thesis-main-pdf.sha256

      - name: Upload thesis PDF and hash
        uses: actions/upload-artifact@v4
        with:
          name: thesis-main-pdf
          path: |
            thesis/main.pdf
            thesis-main-pdf.sha256
