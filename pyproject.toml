[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubik-cube-thesis"
version = "0.1.0"
description = "Rubik's Cube solver implementations, benchmarks, and thesis workflow."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "dataclasses-json",
  "kociemba",
  "matplotlib",
  "memory-profiler",
  "numpy",
  "pandas",
  "plotly",
  "psutil",
  "pytest",
  "RubikOptimal",
  "scipy",
  "seaborn",
  "streamlit",
]

[tool.setuptools.packages.find]
include = ["src*"]
