[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubik-cube-thesis"
version = "0.1.0"
description = "Rubik's Cube solver implementations, benchmarks, and thesis workflow."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "dataclasses-json",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
native = [
  "kociemba>=1.2.1",
]
external-exact = [
  "RubikOptimal>=1.1.0",
]
benchmark = [
  "matplotlib",
  "memory-profiler",
  "pandas",
  "psutil",
  "seaborn",
]
ui = [
  "plotly",
  "streamlit",
]
test = [
  "pytest",
  "pytest-benchmark",
  "pytest-cov",
]
dev = [
  "black",
  "mypy",
  "pylint",
]
notebooks = [
  "imageio",
  "ipywidgets",
  "jupyter",
  "jupyterlab",
  "pillow",
  "rich",
]
thesis = [
  "kociemba>=1.2.1",
  "RubikOptimal>=1.1.0",
  "matplotlib",
  "memory-profiler",
  "pandas",
  "plotly",
  "psutil",
  "pytest",
  "pytest-benchmark",
  "pytest-cov",
  "seaborn",
  "streamlit",
  "imageio",
  "ipywidgets",
  "jupyter",
  "jupyterlab",
  "pillow",
  "rich",
]

[tool.setuptools.packages.find]
include = ["src*"]
